# -------------------------------------------------------
# IoT-CIC-Sandbox — full-stack deployment
#
# Starts MongoDB, the sandbox-manager, and one sandbox-worker
# on a shared internal network.
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in all values.
#      Configuration is passed to containers at runtime; no .env
#      file is copied into any image.
#   2. Put samples in ./malware (or set MALWARE_DIR in .env).
#   3. sudo docker compose up --build
#
# See docs/deployment.md for details and what is not yet verified.
# -------------------------------------------------------

services:

  # ── MongoDB ─────────────────────────────────────────
  # Pinned to MongoDB 8.0 (newest server line supported by PyMongo 4.11,
  # wire version <= 25). See docs/deployment.md for the rationale.
  mongo-db:
    image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    restart: always
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - ./data/mongo/:/data/db/
    networks:
      - dbnet

  # ── Sandbox Manager ─────────────────────────────────
  sandbox-manager:
    build: ./sandbox-manager
    image: sandbox-manager
    restart: on-failure
    ports:
      # Bound to loopback by default; reach it through an SSH tunnel.
      - '${MANAGER_BIND_ADDR:-127.0.0.1}:${MANAGER_PORT:-8011}:8011'
    environment:
      PORT: 8011
      APP_BASE_URL: "/api/v1/sandbox-manager"
      MONGO_HOST: mongo-db:27017
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_DB: sandbox
      MALWARE_DIRECTORY: /malware
      # Relative to WORKDIR /app (sandbox-manager/Dockerfile), i.e.
      # /app/output and /app/uploads — persisted by the bind mounts below.
      OUTPUT_DIR: ./output/
      UPLOAD_DIR: ./uploads/
    volumes:
      # Directory containing malware samples (read-only).
      - ${MALWARE_DIR:-./malware}:/malware:ro
      # Result zips received from workers (submit-result).
      - ./data/manager/output:/app/output
      # Files uploaded via submit-file; their paths are stored in MongoDB.
      - ./data/manager/uploads:/app/uploads
    networks:
      dbnet:
      sandboxnet:
        ipv4_address: 192.168.60.10
    depends_on:
      - mongo-db

  # ── Sandbox Worker ──────────────────────────────────
  # A single worker. The worker auto-detects the architecture of each
  # binary at runtime. The QEMU guest is attached to a dedicated tap0 link
  # (10.200.0.0/30) inside the worker's own network namespace; it is not
  # bridged to sandboxnet (CT-01, docs/network-isolation-design.md).
  # NOT YET VERIFIED with a running guest - do not analyse real samples.
  sandbox-worker-1:
    build: ./sandbox-worker
    image: sandbox-worker
    privileged: true
    restart: on-failure
    environment:
      PORT: 8011
      APP_BASE_URL: "/api/v1/sandbox-worker"
      APP_NAME: sandbox-worker-1
      SANDBOX_MANAGER_URI: http://sandbox-manager:8011/api/v1/sandbox-manager
      ANALYSIS_DURATION: ${ANALYSIS_DURATION:-30}
      POST_ANALYSIS_WAIT: ${POST_ANALYSIS_WAIT:-30}
      # Only "false" is accepted; run.sh refuses to start otherwise (CT-01).
      ALLOW_VM_INTERNET: ${ALLOW_VM_INTERNET:-false}
    networks:
      sandboxnet:
        ipv4_address: 192.168.60.2

networks:
  dbnet:
  sandboxnet:
    ipam:
      driver: default
      config:
        - subnet: "192.168.60.0/24"
          gateway: "192.168.60.1"
